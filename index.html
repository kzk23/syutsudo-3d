<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="出土 SYUTSUDO の3Dプリント植木鉢「鑿 NOMI」48形を、3Dの売り場で見て選べます。">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>出土の売り場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* 薄暗い土蔵の売り場: 円く並んだ棚を、中央に立って見回す。棚ごとに形の名前、鉢は実寸 */
:root{
  --bg:#17140f; --wall:#221d17; --ink:#ece6da; --mute:#a59a88; --line:#3a3127; --ember:#c9874a; --panel:rgba(26,22,17,.92);
  --f-disp:"Shippori Mincho","Yu Mincho","游明朝",serif; --f-body:"Zen Kaku Gothic New","Hiragino Sans",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
body.light{--bg:#d4d3d0;--ink:#1f1e1c;--mute:#5e5c58;--line:#aeaca7;--ember:#8f5124;--panel:rgba(242,241,238,.92);color-scheme:light}
body.light #card a.buy{color:#fff}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;inset:0 0 auto;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none;background:linear-gradient(var(--bg),transparent)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-family:var(--f-disp);font-weight:600;font-size:22px;letter-spacing:.18em;margin:0}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--mute);letter-spacing:.12em}
nav{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-bottom:4px}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;font:inherit;font-size:13px;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:2px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
nav button b{font-family:var(--f-disp);font-weight:600;font-size:16px;color:var(--ink)}
nav button small{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em}
nav button[aria-current="true"]{border-color:var(--ember);color:var(--ember)}
nav button:focus-visible,.ctl button:focus-visible,a:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.ctl{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}
.ctl>*{pointer-events:auto}
.ctl button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:2px;height:40px;min-width:40px;padding:0 12px;cursor:pointer}
.tone{display:flex}
.tone button{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.tone button[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}
.hint{font-size:12px;line-height:1.5;color:var(--ink);text-align:center;flex:0 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);padding:6px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#card .near{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line);padding:9px;cursor:pointer;border-radius:2px}
#card .near[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}
#card{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(120px + env(safe-area-inset-top,0px));width:min(320px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(6px)}
#card .code{font-family:var(--f-mono);font-size:12px;color:var(--ember);letter-spacing:.06em}
#card h2{font-family:var(--f-disp);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
#card dt{color:var(--mute)} #card dd{margin:0;font-variant-numeric:tabular-nums}
#card .price{font-family:var(--f-disp);font-size:22px}
#card .price small{font-size:12px;color:var(--mute);font-family:var(--f-body)}
#card a.buy{display:block;text-align:center;background:var(--ember);color:#1a120a;text-decoration:none;font-weight:500;padding:11px;border-radius:2px}
#card .x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer}
#card p{margin:0;font-size:12px;color:var(--mute);line-height:1.7}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(30,30,28,.28))}
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#d5d4d0 url(tex/wall_d.webp) center/900px;color:#1b1815;transition:opacity .9s ease,visibility .9s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#load::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(236,234,229,.55),rgba(150,148,143,.35))}
#load.done{opacity:0;visibility:hidden}
#load .ld{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;width:min(420px,100%)}
#load .seal{width:min(200px,46vw);height:auto;overflow:visible}
/* 陶印の5本の層: 読み込みに合わせて左から掘り出される */
#load .sx{fill:#c45e3d;clip-path:inset(0 calc(100% - var(--p,0%)) 0 0);transition:clip-path .7s cubic-bezier(.3,.7,.2,1);filter:drop-shadow(0 1px 0 rgba(255,250,240,.5)) drop-shadow(0 -1px 0 rgba(60,30,20,.25))}
#load .word{width:min(260px,62vw);height:auto;fill:#1b1815;opacity:0;transform:translateY(6px);transition:opacity 1.2s ease .3s,transform 1.2s ease .3s}
#load.on .word{opacity:1;transform:none}
#load .lead{margin:4px 0 0;font-family:var(--f-disp);font-size:15px;letter-spacing:.32em;color:#3a3631;opacity:0;transition:opacity 1.2s ease .9s;text-align:center}
#load.on .lead{opacity:1}
#load .meter{width:min(220px,60vw);height:1px;background:rgba(27,24,21,.18);overflow:hidden}
#load .meter span{display:block;height:100%;width:0;background:#c45e3d;transition:width .5s ease}
#load .cnt{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:#4a463f;font-variant-numeric:tabular-nums;text-align:center}
@media (prefers-reduced-motion:reduce){#load .sx,#load .word,#load .lead,#load{transition:none}}
#card .hd2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
@media (max-width:600px),(max-aspect-ratio:9/10){#card{top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));right:16px;left:16px;width:auto;padding:12px 14px;gap:7px}#card h2{font-size:20px}#card .price{font-size:20px}#card .price small{display:none}#card dl{display:flex;flex-wrap:wrap;gap:2px 0;font-size:12px}#card dt{display:none}#card dd+dt+dd::before{content:'·';margin:0 7px;color:var(--mute)}#card a.buy{padding:10px}#card p{display:none}body.sel .hint{display:none}}
</style>
